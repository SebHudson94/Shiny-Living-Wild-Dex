<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a0533">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Shiny Dex">
  <title>Shiny Living Dex Tracker</title>
  <link rel="manifest" href="manifest.json">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{min-height:100vh;background:linear-gradient(160deg,#0a0018 0%,#1a0533 50%,#0d0a2e 100%);font-family:'Segoe UI',system-ui,sans-serif;color:#f0e8ff;padding-bottom:60px}
    header{background:linear-gradient(90deg,#6a0dad 0%,#ff69b4 50%,#ffd700 100%);padding:22px 16px 16px;text-align:center;box-shadow:0 4px 24px rgba(255,105,180,0.4)}
    .sub{font-size:10px;letter-spacing:4px;text-transform:uppercase;opacity:.75;margin-bottom:4px}
    h1{font-size:22px;font-weight:800;letter-spacing:-.5px;text-shadow:0 2px 12px rgba(255,215,0,0.6);margin-bottom:4px}
    .tag{font-size:12px;opacity:.8}
    main{padding:14px 12px 0}
    .sticky-controls{position:sticky;top:0;z-index:10;background:#150430;padding:10px 0 8px;margin:0 -12px;padding-left:12px;padding-right:12px;box-shadow:0 6px 12px -4px rgba(0,0,0,0.4)}
    .gen-pct{font-size:9px;opacity:.55;font-weight:400;letter-spacing:0;text-transform:none;margin-left:6px}
    #top-btn{position:fixed;bottom:18px;right:18px;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#6a0dad,#ff69b4);border:none;color:#fff;font-size:18px;box-shadow:0 4px 16px rgba(0,0,0,0.5);cursor:pointer;display:none;align-items:center;justify-content:center;z-index:20}
    #top-btn.show{display:flex}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
    .stat-box{background:rgba(255,255,255,0.07);border-radius:10px;padding:10px 8px;text-align:center;border:1px solid rgba(255,105,180,0.2)}
    .stat-label{font-size:10px;opacity:.6;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
    .stat-val{font-size:16px;font-weight:800}
    .stat-val.shiny{color:#ffd700}
    .stat-val.luxury{color:#e74c3c}
    .stat-val.wild{color:#2ecc71}
    .progress-bar-wrap{background:rgba(255,255,255,0.1);border-radius:99px;height:8px;overflow:hidden;margin-bottom:12px}
    .progress-bar-fill{height:100%;background:linear-gradient(90deg,#6a0dad,#ff69b4,#ffd700);border-radius:99px;transition:width .3s}
    .controls{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
    #search{flex:1 1 140px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,105,180,0.25);border-radius:8px;padding:8px 11px;color:#f0e8ff;font-size:13px;outline:none}
    #search::placeholder{color:rgba(240,232,255,0.35)}
    .fbtns{display:flex;gap:5px;flex-wrap:wrap}
    .filter-group{display:flex;gap:5px;flex-wrap:wrap}
    .ftog{display:flex;align-items:center;gap:5px;padding:7px 11px;border-radius:7px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:#b0a0c8;font-size:11px;cursor:pointer;transition:all .15s;white-space:nowrap;user-select:none}
    .ftog .state{font-size:10px;font-weight:700;opacity:.6;min-width:40px}
    .ftog.have{border-color:rgba(255,215,0,0.5);background:rgba(255,215,0,0.1);color:#ffd700}
    .ftog.have .state{opacity:1;color:#ffd700}
    .ftog.havent{border-color:rgba(231,76,60,0.5);background:rgba(231,76,60,0.1);color:#e74c3c}
    .ftog.havent .state{opacity:1;color:#e74c3c}
    .freset{padding:7px 10px;border-radius:7px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#777;font-size:11px;cursor:pointer;transition:all .15s}
    .freset:active{background:rgba(255,255,255,0.1);color:#ccc}
    .io-btns{display:flex;gap:6px;margin-top:8px}
    .io-btn{flex:1;padding:8px;border-radius:7px;border:1px solid rgba(255,105,180,0.2);background:rgba(255,255,255,0.05);color:#c0b0d8;font-size:12px;cursor:pointer;text-align:center;transition:all .15s}
    .io-btn:active{background:rgba(106,13,173,0.3)}
    .jumps{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
    .gj{padding:5px 9px;border-radius:6px;border:1px solid rgba(255,215,0,0.2);background:rgba(255,255,255,0.04);color:#c0b0d8;font-size:11px;cursor:pointer;transition:all .15s}
    .gj:active{background:rgba(255,215,0,0.2)}
    .gj.form-jump{border-color:rgba(180,130,255,0.3);color:#c9b8f0}
    .section-header{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:12px 4px 6px;color:#ffd700;opacity:.6}
    .section-header.form-section{color:#c084fc;opacity:.7}
    #list{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
    .full-row{grid-column:1/-1}
    .card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:10px 10px 8px;transition:border-color .15s}
    .card.has-shiny{border-color:rgba(255,215,0,0.45);background:rgba(255,215,0,0.05)}
    .card-num{font-size:10px;opacity:.4;margin-bottom:2px}
    .card-name{font-size:12px;font-weight:600;color:#e0d0ff;margin-bottom:6px;line-height:1.3}
    .form-tag{display:inline-block;font-size:9px;background:rgba(106,13,173,0.45);border-radius:3px;padding:1px 4px;margin-left:4px;vertical-align:middle;color:#c9b8f0}
    .checks{display:flex;flex-direction:column;gap:5px}
    .check-row{display:flex;align-items:center;gap:7px;cursor:pointer;padding:3px 0;user-select:none}
    .box{width:16px;height:16px;border-radius:3px;border:1.5px solid rgba(255,255,255,0.25);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;transition:all .15s}
    .shiny-box{border-color:#b8960c}
    .shiny-box.checked{background:rgba(255,215,0,0.25);color:#ffd700;border-color:#ffd700}
    .luxury-box{border-color:#922b21}
    .luxury-box.checked{background:rgba(192,57,43,0.25);color:#e74c3c;border-color:#e74c3c}
    .wild-box{border-color:#1e8449}
    .wild-box.checked{background:rgba(39,174,96,0.2);color:#2ecc71;border-color:#2ecc71}
    .check-label{font-size:11px;opacity:.65}
    .empty{text-align:center;padding:40px 0;opacity:.4;font-size:14px;grid-column:1/-1}
  </style>
</head>
<body>
<header>
  <div class="sub">National Pokédex · Gen 1–9</div>
  <h1>✨ Shiny Living Dex</h1>
  <div class="tag" id="header-tag">Loading…</div>
</header>
<main>
  <div class="stats">
    <div class="stat-box"><div class="stat-label">Shiny</div><div class="stat-val shiny" id="s-shiny">0</div></div>
    <div class="stat-box"><div class="stat-label">Luxury Ball</div><div class="stat-val luxury" id="s-luxury">0</div></div>
    <div class="stat-box"><div class="stat-label">Caught Wild</div><div class="stat-val wild" id="s-wild">0</div></div>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="prog-fill" style="width:0%"></div></div>
  <div class="sticky-controls">
    <div class="controls">
      <input type="text" id="search" placeholder="Search name or #…">
      <div class="filter-group">
        <button class="ftog" id="f-shiny">✨ Shiny <span class="state">—</span></button>
        <button class="ftog" id="f-luxury">🔴 Luxury <span class="state">—</span></button>
        <button class="ftog" id="f-wild">🟢 Wild <span class="state">—</span></button>
        <button class="freset" id="f-reset">Reset</button>
      </div>
      <div class="io-btns">
        <button class="io-btn" id="btn-export">📤 Export progress</button>
        <button class="io-btn" id="btn-import">📥 Import progress</button>
        <input type="file" id="import-input" accept=".json" style="display:none">
      </div>
    </div>
    <div class="jumps" id="jumps"></div>
  </div>
  <div id="list"></div>
</main>
<button id="top-btn" aria-label="Scroll to top">↑</button>

const STORAGE_KEY="shiny-living-dex-v1";
let store={};
try{const s=localStorage.getItem(STORAGE_KEY);if(s)store=JSON.parse(s);}catch{}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(store));}catch{}}
function get(k){return store[k]||{shiny:false,luxury:false,wild:false};}
function toggle(k,f){if(!store[k])store[k]={};store[k][f]=!store[k][f];save();}

function updateStats(){
  let sh=0,lx=0,wi=0;
  POKEMON.forEach(p=>{const d=get(p.key);if(d.shiny)sh++;if(d.luxury)lx++;if(d.wild)wi++;});
  document.getElementById("s-shiny").textContent=sh;
  document.getElementById("s-luxury").textContent=lx;
  document.getElementById("s-wild").textContent=wi;
  const pct=Math.round(sh/POKEMON.length*100);
  document.getElementById("prog-fill").style.width=pct+"%";
  document.getElementById("header-tag").textContent=`${POKEMON.length} entries · ${sh} shiny (${pct}%)`;
}

function matchFilter(p){
  const d=get(p.key);
  if(filters.shiny===1&&!d.shiny) return false;
  if(filters.shiny===2&&d.shiny) return false;
  if(filters.luxury===1&&!d.luxury) return false;
  if(filters.luxury===2&&d.luxury) return false;
  if(filters.wild===1&&!d.wild) return false;
  if(filters.wild===2&&d.wild) return false;
  return true;
}

function pad(n){return String(n).padStart(4,"0");}

function makeCard(p){
  const d=get(p.key);
  const card=document.createElement("div");
  card.className="card"+(d.shiny?" has-shiny":"");
  const displayName=p.form||p.name;
  card.innerHTML=`<div class="card-num">#${pad(p.id)}</div>
<div class="card-name">${p.form?p.name+' <span class="form-tag">'+p.form+'</span>':p.name}</div>
<div class="checks">
  <label class="check-row"><div class="box shiny-box${d.shiny?" checked":""}">${d.shiny?"✓":""}</div><span class="check-label">✨ Shiny</span></label>
  <label class="check-row"><div class="box luxury-box${d.luxury?" checked":""}">${d.luxury?"✓":""}</div><span class="check-label">🔴 Luxury Ball</span></label>
  <label class="check-row"><div class="box wild-box${d.wild?" checked":""}">${d.wild?"✓":""}</div><span class="check-label">🟢 Caught Wild</span></label>
</div>`;
  card.querySelectorAll(".check-row").forEach((row,i)=>{
    const fields=["shiny","luxury","wild"];
    row.addEventListener("click",e=>{
      e.preventDefault();
      toggle(p.key,fields[i]);
      const nd=get(p.key);
      const v=nd[fields[i]];
      const box=row.querySelector(".box");
      box.className="box "+["shiny-box","luxury-box","wild-box"][i]+(v?" checked":"");
      box.textContent=v?"✓":"";
      if(fields[i]==="shiny") card.className="card"+(v?" has-shiny":"");
      updateStats();
    });
  });
  return card;
}

function genProgress(gen){
  const inGen=baseList.filter(p=>p.gen===gen);
  const got=inGen.filter(p=>get(p.key).shiny).length;
  return {got,total:inGen.length,pct:Math.round(got/inGen.length*100)};
}

function sectionBreak(id,text,isForm,pctText){
  const div=document.createElement("div");
  div.className="full-row";
  div.id=id;
  const h=document.createElement("div");
  h.className="section-header"+(isForm?" form-section":"");
  h.textContent=text;
  if(pctText){
    const span=document.createElement("span");
    span.className="gen-pct";
    span.textContent=pctText;
    h.appendChild(span);
  }
  div.appendChild(h);
  return div;
}

function render(){
  const list=document.getElementById("list");
  list.innerHTML="";
  const q=search.toLowerCase();
  const frag=document.createDocumentFragment();
  let visCount=0;

  // ── Base species by gen ──
  let lastGen=null;
  baseList.forEach(p=>{
    const nameMatch=p.name.toLowerCase().includes(q)||String(p.id).includes(q);
    if(!nameMatch||!matchFilter(p)) return;
    visCount++;
    if(p.gen!==lastGen){
      const gp=genProgress(p.gen);
      frag.appendChild(sectionBreak("gen-"+p.gen,`— Gen ${p.gen}: ${GEN_NAMES[p.gen]} —`,false,`${gp.got}/${gp.total} (${gp.pct}%)`));
      lastGen=p.gen;
    }
    frag.appendChild(makeCard(p));
  });

  // ── Alternate forms by category ──
  FORM_CATS.forEach(cat=>{
    const catForms=formList.filter(p=>{
      if(p.section!==cat) return false;
      const nm=(p.name+" "+(p.form||"")).toLowerCase();
      return nm.includes(q)||String(p.id).includes(q);
    }).filter(p=>matchFilter(p));
    if(catForms.length===0) return;
    frag.appendChild(sectionBreak("form-"+cat, FORM_CAT_LABEL[cat], true));
    catForms.forEach(p=>{ frag.appendChild(makeCard(p)); visCount++; });
  });

  list.appendChild(frag);
  document.getElementById("empty").style.display=visCount===0?"block":"none";
  updateStats();
  refreshJumpLabels();
}

// ── Jump buttons ──
const jumps=document.getElementById("jumps");
function refreshJumpLabels(){
  for(let g=1;g<=9;g++){
    const btn=document.getElementById("jump-gen-"+g);
    if(btn){ const gp=genProgress(g); btn.textContent=`G${g} ${gp.pct}%`; }
  }
}
for(let g=1;g<=9;g++){
  const b=document.createElement("button");
  b.className="gj";b.id="jump-gen-"+g;b.textContent="Gen "+g;
  b.addEventListener("click",()=>{ const el=document.getElementById("gen-"+g); if(el)el.scrollIntoView({behavior:"smooth",block:"start"}); });
  jumps.appendChild(b);
}
FORM_CATS.forEach(cat=>{
  const b=document.createElement("button");
  b.className="gj form-jump";
  b.textContent={Alolan:"Alolan",Galarian:"Galarian",Hisuian:"Hisuian",Paldean:"Paldean",Other:"Other"}[cat];
  b.addEventListener("click",()=>{ const el=document.getElementById("form-"+cat); if(el)el.scrollIntoView({behavior:"smooth",block:"start"}); });
  jumps.appendChild(b);
});

document.getElementById("search").addEventListener("input",e=>{search=e.target.value;render();});

// Filter toggles: cycle off → have → haven't → off
["shiny","luxury","wild"].forEach(field=>{
  document.getElementById("f-"+field).addEventListener("click",()=>{
    filters[field]=(filters[field]+1)%3;
    const btn=document.getElementById("f-"+field);
    btn.className="ftog"+(filters[field]?" "+FTOG_CLS[filters[field]]:"");
    btn.querySelector(".state").textContent=FTOG_LBL[filters[field]];
    render();
  });
});

document.getElementById("f-reset").addEventListener("click",()=>{
  filters={shiny:0,luxury:0,wild:0};
  ["shiny","luxury","wild"].forEach(f=>{
    const btn=document.getElementById("f-"+f);
    btn.className="ftog";
    btn.querySelector(".state").textContent="—";
  });
  render();
});

// Export progress
document.getElementById("btn-export").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify(store,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="shiny-dex-progress.json";
  a.click();
});

// Import progress
document.getElementById("btn-import").addEventListener("click",()=>{
  document.getElementById("import-input").click();
});
document.getElementById("import-input").addEventListener("change",e=>{
  const file=e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const parsed=JSON.parse(ev.target.result);
      const ok=confirm("This will overwrite your current progress with the imported file. This can't be undone. Continue?");
      if(!ok){ e.target.value=""; return; }
      store=parsed;
      save();
      render();
    }catch{alert("Couldn't read file — make sure it's a valid export.");}
  };
  reader.readAsText(file);
  e.target.value="";
});

// Jump-to-top button
const topBtn=document.getElementById("top-btn");
window.addEventListener("scroll",()=>{
  if(window.scrollY>400) topBtn.classList.add("show");
  else topBtn.classList.remove("show");
});
topBtn.addEventListener("click",()=>{ window.scrollTo({top:0,behavior:"smooth"}); });

render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
